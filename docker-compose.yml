services:
  firefox:
    image: docker-firefox-vnc
    build: .
    container_name: firefox-vnc
    ports:
      - "6080:6080"   # noVNC (browser access)
      - "5900:5900"   # raw VNC
      - "3000:3000"   # Playwright MCP server (SSE)
    environment:
      - VNC_PASSWORD=
      - VNC_GEOMETRY=1280x800x24
      - MCP_PORT=3000
      - MCP_HOST=0.0.0.0
    restart: unless-stopped
